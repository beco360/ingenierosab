services:
  website:
    build: .
    image: ingenierosab:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INGENIEROSAB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
