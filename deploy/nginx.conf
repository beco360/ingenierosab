server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/ld+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    expires -1;

    location = /cultura.html { return 301 /about.html; }
    location = /servicios/remodelaciones.html { return 301 "/services.html#remodeling"; }
    location = /servicios/pisos.html { return 301 "/services.html#floors-tiles"; }
    location = /servicios/estuco-pintura.html { return 301 "/services.html#plaster-paint"; }
    location = /servicios/drywall-superboard.html { return 301 "/services.html#drywall-superboard"; }
    location = /servicios/ventaneria.html { return 301 "/services.html#windows-glass"; }
    location = /servicios/cubiertas.html { return 301 "/services.html#roofing"; }
    location = /servicios/diseños-planimetria.html { return 301 "/services.html#design-plans"; }
    location = /servicios/costos-presupuestos.html { return 301 "/services.html#budgets-scheduling"; }
    location = /servicios/reestructuracion.html { return 301 "/services.html#project-restructuring"; }
    location = /servicios/marco-normativo.html { return 301 "/services.html#regulatory-support"; }
    location = /servicios/concretos.html { return 301 "/services.html#concrete-testing"; }
    location = /servicios/levantamiento-topografico.html { return 301 "/services.html#topographic-surveys"; }
    location = /servicios/preliminares-obra.html { return 301 "/services.html#site-preparation"; }
    location = /servicios/ejecucion.html { return 301 "/services.html#roads-buildings"; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        limit_except GET HEAD { deny all; }
        expires 7d;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
